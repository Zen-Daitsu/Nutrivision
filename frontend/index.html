<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>NutriVision — scan a plate, read the macros</title>
<meta name="description" content="Point the camera at a plate. Get protein, carbs, fat and calories.">
<meta name="theme-color" content="#0B1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<main class="stage" id="stage" data-state="idle">

  <!-- Viewfinder -->
  <section class="viewfinder" aria-label="Camera">
    <video id="preview" playsinline muted autoplay></video>
    <canvas id="frame" hidden></canvas>

    <div class="reticle" aria-hidden="true">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
    </div>

    <div class="scanline" aria-hidden="true"></div>

    <header class="hud">
      <span class="hud__mark">NUTRI<b>VISION</b></span>
      <span class="hud__meta" id="hudMeta">no signal</span>
    </header>

    <p class="hint" id="hint">Fill the frame with the plate. Keep the reference card flat on the table.</p>
  </section>

  <!-- Readout: the signature element. A nutrition label rendered as an instrument panel. -->
  <section class="readout" id="readout" aria-live="polite">
    <div class="readout__head">
      <h1 class="readout__title" id="readoutTitle">Ready</h1>
      <span class="readout__stamp" id="latency"></span>
    </div>

    <dl class="channels" id="channels">
      <div class="channel" data-k="protein">
        <dt>Protein</dt>
        <dd><span class="val" id="vProtein">—</span><i>g</i></dd>
        <div class="bar"><span id="bProtein"></span></div>
      </div>
      <div class="channel" data-k="carbs">
        <dt>Carbs</dt>
        <dd><span class="val" id="vCarbs">—</span><i>g</i></dd>
        <div class="bar"><span id="bCarbs"></span></div>
      </div>
      <div class="channel" data-k="fat">
        <dt>Fat</dt>
        <dd><span class="val" id="vFat">—</span><i>g</i></dd>
        <div class="bar"><span id="bFat"></span></div>
      </div>
    </dl>

    <div class="energy">
      <span class="energy__val" id="vKcal">—</span>
      <span class="energy__unit">kcal</span>
    </div>

    <ul class="items" id="items"></ul>
    <p class="disclosure" id="disclosure"></p>
  </section>

  <!-- Controls -->
  <nav class="controls">
    <button id="btnFlip" class="btn btn--ghost" type="button" aria-label="Switch camera">Flip</button>
    <button id="btnShoot" class="btn btn--shutter" type="button">Scan plate</button>
    <button id="btnReset" class="btn btn--ghost" type="button">Clear</button>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
</main>

<script src="/js/config.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
