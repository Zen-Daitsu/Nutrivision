name: build-mojo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
          locked: false
          cache: false

      - name: Prepare a library-only copy of the kernel
        run: |
          mkdir -p mojo/gen mojo/build
          # A shared library cannot contain main(), so drop it from the copy.
          sed '/^fn main():/,$d; /^def main():/,$d' mojo/postprocess.mojo > mojo/gen/kernel.mojo
          echo "--- tail of prepared source ---"
          tail -5 mojo/gen/kernel.mojo

      - name: Auto-migrate to Mojo 1.0 and build
        id: build
        continue-on-error: true
        run: |
          pixi run mojo build --emit shared-lib --experimental-fixit \
            mojo/gen/kernel.mojo -o mojo/build/libnvpost.so

      - name: Show the migrated source
        if: always()
        run: |
          echo "=============== MIGRATED kernel.mojo ==============="
          cat mojo/gen/kernel.mojo

      - name: Inspect the artifact
        if: steps.build.outcome == 'success'
        run: |
          file mojo/build/libnvpost.so
          echo "--- exported symbols ---"
          nm -D mojo/build/libnvpost.so | grep -E "nv_decode_nms|nv_abi_version" || echo "NO C SYMBOLS EXPORTED"
          echo "--- runtime dependencies ---"
          ldd mojo/build/libnvpost.so

      - name: Can ctypes load it outside the pixi env
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('mojo/build/libnvpost.so')
          lib.nv_abi_version.restype = ctypes.c_int32
          print('nv_abi_version() ->', lib.nv_abi_version())
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mojo-kernel
          path: |
            backend/mojo/build/
            backend/mojo/gen/
          if-no-files-found: ignore
