name: build-mojo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
          locked: false
          cache: false

      - name: Try each pointer spelling
        run: |
          mkdir -p mojo/build
          WINNER=""
          for v in a b c; do
            echo "=================== VARIANT $v ==================="
            if pixi run mojo build --emit shared-lib "mojo/probe_$v.mojo" \
                 -o "mojo/build/lib_$v.so" 2>&1; then
              echo ">>> VARIANT $v COMPILED"
              [ -z "$WINNER" ] && WINNER="$v"
            else
              echo ">>> variant $v failed"
            fi
          done
          echo "WINNER=$WINNER" | tee -a "$GITHUB_ENV"
          ls -la mojo/build/

      - name: Inspect and load
        if: env.WINNER != ''
        continue-on-error: true
        run: |
          SO="mojo/build/lib_${WINNER}.so"
          file "$SO"
          echo "--- exported symbols ---"
          nm -D "$SO" | grep -E "nv_decode_nms|nv_abi_version" || echo "NO C SYMBOLS"
          echo "--- runtime dependencies ---"
          ldd "$SO"
          echo "--- ctypes from system python ---"
          python3 -c "
          import ctypes, os
          lib = ctypes.CDLL(os.environ['SO'])
          lib.nv_abi_version.restype = ctypes.c_int32
          print('nv_abi_version() ->', lib.nv_abi_version())
          "
        env:
          SO: mojo/build/lib_${{ env.WINNER }}.so

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mojo-kernel
          path: backend/mojo/build/
          if-no-files-found: ignore
