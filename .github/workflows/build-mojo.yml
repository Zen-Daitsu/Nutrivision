# ==============================================================================
#  build-mojo — Mojo 1.0 kernel toolchain validation
# ==============================================================================
#
#  PURPOSE
#    Validates the foreign-function boundary between the Mojo postprocessing
#    kernel and the Python inference service before that kernel is promoted
#    into the production image. Three properties must hold:
#
#      1. SYMBOL EXPORT    @export must emit an unmangled C symbol.
#      2. SELF-CONTAINMENT The shared object must carry no MAX runtime
#                          dependency, or the production image grows ~200 MB
#                          and no longer fits a 1 GB Lightsail node.
#      3. MEMORY CONTRACT  The kernel must read caller-owned memory correctly
#                          through a raw address.
#
#  ABI CONTRACT
#    Pointers cross the boundary as `Int` addresses rather than typed Mojo
#    pointers. This is deliberate. Mojo 1.0 requires a bound `origin` parameter
#    on pointer types; leaving it unbound makes the function parametric, and
#    `@export` rejects parametric functions. Passing the address as a machine
#    word matches what the C ABI transmits anyway, and confines origin handling
#    to the function body where genericity is permitted.
#
#      Python  ctypes.c_void_p            <--  arr.ctypes.data
#      Mojo    p: Int                     -->  Pointer[Float32](
#                                                unsafe_from_address=p)
#
#  TOOLCHAIN
#    Mojo 1.0.0 / MAX 26.5.0, released 2026-08-11. This release removed `fn`,
#    renamed `alias` to `comptime`, made implicit stdlib imports an error, and
#    deprecated `UnsafePointer` in favour of `Pointer`.
#
#  EXIT CRITERIA
#    When the memory contract passes, fold the winning signature into
#    backend/mojo/postprocess.mojo, move the build into backend/Dockerfile,
#    and delete this file.
# ==============================================================================

name: build-mojo

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: backend

env:
  PIXI_MANIFEST: backend/pixi.toml
  BUILD_DIR: mojo/build
  GEN_DIR: mojo/gen

jobs:
  validate-abi:
    name: Validate FFI contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provision Mojo toolchain
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: ${{ env.PIXI_MANIFEST }}
          locked: false     # no pixi.lock committed; resolve fresh
          cache: false      # cache key derives from pixi.lock, which is absent

      # ------------------------------------------------------------------
      # Mojo is newly stable and its syntax moved substantially in 1.0.
      # A failure report without a version is not actionable later.
      # ------------------------------------------------------------------
      - name: Record toolchain fingerprint
        run: |
          MOJO_VER=$(pixi run mojo --version 2>&1 | head -1)
          MAX_VER=$(pixi list 2>/dev/null | awk '/^max /{print $2}')

          {
            echo "## Toolchain"
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Mojo compiler | \`${MOJO_VER}\` |"
            echo "| MAX platform | \`${MAX_VER}\` |"
            echo "| Runner | \`${RUNNER_OS} ${RUNNER_ARCH}\` |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # The MAX distribution ships first-party Mojo sources. They are more
      # reliable than documentation, which lags the compiler.
      # ------------------------------------------------------------------
      - name: Mine first-party Mojo sources for 1.0 idioms
        continue-on-error: true
        run: |
          SP=".pixi/envs/default/lib/python3.14/site-packages/max"
          if [ ! -d "$SP" ]; then
            echo "reference sources not present"
            exit 0
          fi

          {
            echo "## Reference idioms from shipped MAX sources"
            echo
            echo "<details><summary>Pointer construction</summary>"
            echo
            echo '```mojo'
            grep -rhE "Pointer\[.*\]\(" "$SP" --include=*.mojo \
              | sed 's/^[[:space:]]*//' | sort -u | head -20 || true
            echo '```'
            echo
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Candidates are generated here rather than committed, so a rejected
      # spelling never becomes repository debt.
      # ------------------------------------------------------------------
      - name: Generate candidate kernel signatures
        run: |
          mkdir -p "$GEN_DIR" "$BUILD_DIR"

          # A — current pointer type, address constructor, inferred origin.
          #     Derived from the constructor list the compiler emitted:
          #       def __init__(*, unsafe_from_address: Int) -> Self
          cat > "$GEN_DIR/a.mojo" <<'MOJO'
          from std.memory import Pointer

          @export("nv_probe")
          def nv_probe(p: Int, n: Int32) abi("C") -> Int32:
              var ptr = Pointer[Float32](unsafe_from_address=p)
              return Int32(1) if ptr[0] > 0.0 else Int32(0)
          MOJO

          # B — deprecated alias, same constructor. Confirms the alias still
          #     resolves, in case Pointer's defaults differ.
          cat > "$GEN_DIR/b.mojo" <<'MOJO'
          from std.memory import UnsafePointer

          @export("nv_probe")
          def nv_probe(p: Int, n: Int32) abi("C") -> Int32:
              var ptr = UnsafePointer[Float32](unsafe_from_address=p)
              return Int32(1) if ptr[0] > 0.0 else Int32(0)
          MOJO

          # C — write path. The production kernel writes results back through
          #     out_* pointers, so a read-only proof is insufficient.
          cat > "$GEN_DIR/c.mojo" <<'MOJO'
          from std.memory import Pointer

          @export("nv_probe")
          def nv_probe(p: Int, n: Int32) abi("C") -> Int32:
              var ptr = Pointer[Float32](unsafe_from_address=p)
              var seen = Int32(1) if ptr[0] > 0.0 else Int32(0)
              ptr[1] = 42.0
              return seen
          MOJO

          # D — control. Known to compile. Isolates memory access as the
          #     variable under test rather than the export machinery.
          cat > "$GEN_DIR/d.mojo" <<'MOJO'
          @export("nv_probe")
          def nv_probe(p: Int, n: Int32) abi("C") -> Int32:
              return Int32(1)
          MOJO

      - name: Compile candidates
        id: compile
        run: |
          declare -A LABEL=(
            [a]="Pointer, unsafe_from_address"
            [b]="UnsafePointer, unsafe_from_address"
            [c]="Pointer, read and write"
            [d]="control, no memory access"
          )

          WINNER=""
          ROWS=""

          for v in a b c d; do
            echo "::group::candidate ${v} — ${LABEL[$v]}"
            cat "$GEN_DIR/$v.mojo"

            if pixi run mojo build --emit shared-lib \
                 "$GEN_DIR/$v.mojo" -o "$BUILD_DIR/$v.so" 2>&1; then
              ROWS+="| \`${v}\` | ${LABEL[$v]} | compiled |"$'\n'
              # Prefer the write-capable variant; never elect the control.
              if [ "$v" = "c" ]; then
                WINNER="c"
              elif [ -z "$WINNER" ] && [ "$v" != "d" ]; then
                WINNER="$v"
              fi
            else
              ROWS+="| \`${v}\` | ${LABEL[$v]} | rejected |"$'\n'
            fi
            echo "::endgroup::"
          done

          echo "winner=${WINNER}" >> "$GITHUB_OUTPUT"

          {
            echo "## Candidate signatures"
            echo
            echo "| Variant | Signature | Result |"
            echo "|---|---|---|"
            printf '%s' "$ROWS"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # `statically linked` decides whether this ships. Anything else means
      # the MAX runtime must accompany the library into production.
      # ------------------------------------------------------------------
      - name: Verify linkage and symbol export
        if: steps.compile.outputs.winner != ''
        run: |
          SO="$BUILD_DIR/${{ steps.compile.outputs.winner }}.so"
          SIZE=$(stat -c%s "$SO")
          SYMBOL=$(nm -D "$SO" | grep -E "\bnv_probe\b" || echo "ABSENT")
          DEPS=$(ldd "$SO" 2>&1 | sed 's/^[[:space:]]*//' | head -1)

          {
            echo "## Artifact"
            echo
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Size | $((SIZE / 1024)) KB |"
            echo "| Exported symbol | \`${SYMBOL}\` |"
            echo "| Linkage | \`${DEPS}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if ! echo "$DEPS" | grep -qi "statically linked"; then
            echo "::warning::Library carries runtime dependencies; production image will grow"
          fi

          if echo "$SYMBOL" | grep -q "ABSENT"; then
            echo "::error::No C symbol exported"
            exit 1
          fi

      # ------------------------------------------------------------------
      # The decisive test. A library that loads is not a library that reads
      # and writes the caller's memory correctly.
      # ------------------------------------------------------------------
      - name: Assert memory contract across the FFI boundary
        if: steps.compile.outputs.winner != ''
        id: contract
        env:
          WINNER: ${{ steps.compile.outputs.winner }}
        run: |
          python3 - "$BUILD_DIR/${WINNER}.so" "$WINNER" <<'PY'
          import array, ctypes, sys

          so, variant = sys.argv[1], sys.argv[2]
          lib = ctypes.CDLL(so)
          lib.nv_probe.restype = ctypes.c_int32
          lib.nv_probe.argtypes = [ctypes.c_void_p, ctypes.c_int32]

          buf = array.array("f", [3.5, 1.0, 2.0])
          addr = buf.buffer_info()[0]

          positive = lib.nv_probe(addr, len(buf))
          buf[0] = -1.0
          negative = lib.nv_probe(addr, len(buf))

          print(f"read  buf[0] = +3.5 -> kernel returned {positive}")
          print(f"read  buf[0] = -1.0 -> kernel returned {negative}")
          assert positive == 1, "kernel did not observe a positive value"
          assert negative == 0, "kernel did not observe the mutated value"

          if variant == "c":
              print(f"write buf[1] = {buf[1]} (kernel should have set 42.0)")
              assert buf[1] == 42.0, "kernel write did not reach caller memory"
              print("bidirectional memory contract holds")
          else:
              print("read-only memory contract holds")
          PY

      - name: Publish verdict
        if: always()
        env:
          WINNER: ${{ steps.compile.outputs.winner }}
          CONTRACT: ${{ steps.contract.outcome }}
        run: |
          {
            echo "## Verdict"
            echo
            if [ -z "$WINNER" ]; then
              echo "**No candidate compiled.** The exported-function signature"
              echo "remains unresolved. Review the reference idioms above and"
              echo "extend the candidate set."
            elif [ "$CONTRACT" = "success" ]; then
              echo "**FFI contract validated** using variant \`${WINNER}\`."
              echo
              echo "Next actions:"
              echo "1. Apply this signature to \`backend/mojo/postprocess.mojo\`."
              echo "2. Change \`mojo_bridge.py\` argtypes to \`c_void_p\` and pass"
              echo "   \`arr.ctypes.data\` at the call sites."
              echo "3. Add the pixi build stage to \`backend/Dockerfile\`, set"
              echo "   \`NV_MOJO_ENABLED=1\`, and confirm parity via"
              echo "   \`tests/test_postprocess.py\`."
              echo "4. Delete this workflow."
            else
              echo "**Compiles but the memory contract failed.** Variant"
              echo "\`${WINNER}\` produced a loadable library that does not"
              echo "access caller memory as expected. Inspect the"
              echo "address-to-pointer conversion before proceeding."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mojo-abi-validation
          path: |
            backend/mojo/build/
            backend/mojo/gen/
          retention-days: 7
          if-no-files-found: ignore
