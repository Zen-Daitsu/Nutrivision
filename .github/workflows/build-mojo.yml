name: build-mojo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
          locked: false
          cache: false

      - name: Hunt for the origin type in the shipped stdlib
        continue-on-error: true
        run: |
          ROOT=.pixi/envs/default
          echo "--- files mentioning MutOrigin ---"
          grep -rl "MutOrigin" "$ROOT" 2>/dev/null | head -20
          echo "--- files mentioning OpaquePointer ---"
          grep -rl "OpaquePointer" "$ROOT" 2>/dev/null | head -20
          echo "--- AnyOrigin spellings ---"
          grep -rhoE "[A-Za-z]*AnyOrigin" "$ROOT" 2>/dev/null | sort -u | head -20

      - name: Generate and test every candidate signature
        run: |
          mkdir -p mojo/gen mojo/build

          cat > mojo/gen/v1.mojo <<'EOF'
          from std.memory import OpaquePointer, MutOrigin
          @export("nv_probe")
          def nv_probe(p: OpaquePointer[MutOrigin.external], n: Int32) abi("C") -> Int32:
              return 1
          EOF

          cat > mojo/gen/v2.mojo <<'EOF'
          from std.memory import Pointer, MutOrigin
          @export("nv_probe")
          def nv_probe(p: Pointer[Float32, MutOrigin.external], n: Int32) abi("C") -> Int32:
              return 1
          EOF

          cat > mojo/gen/v3.mojo <<'EOF'
          from std.memory import Pointer, MutableAnyOrigin
          @export("nv_probe")
          def nv_probe(p: Pointer[Float32, MutableAnyOrigin], n: Int32) abi("C") -> Int32:
              return 1
          EOF

          cat > mojo/gen/v4.mojo <<'EOF'
          from std.memory import UnsafePointer, MutableAnyOrigin
          @export("nv_probe")
          def nv_probe(p: UnsafePointer[Float32, MutableAnyOrigin], n: Int32) abi("C") -> Int32:
              return 1
          EOF

          cat > mojo/gen/v5.mojo <<'EOF'
          @export("nv_probe")
          def nv_probe(p: Int, n: Int32) abi("C") -> Int32:
              return 1
          EOF

          WINNER=""
          for v in v1 v2 v3 v4 v5; do
            echo "=================== $v ==================="
            sed -n '1,3p' "mojo/gen/$v.mojo"
            if pixi run mojo build --emit shared-lib "mojo/gen/$v.mojo" \
                 -o "mojo/build/$v.so" 2>&1; then
              echo ">>> $v COMPILED"
              [ -z "$WINNER" ] && WINNER="$v"
            else
              echo ">>> $v failed"
            fi
          done
          echo "WINNER=$WINNER" | tee -a "$GITHUB_ENV"
          ls -la mojo/build/

      - name: Inspect and load the winner
        if: env.WINNER != ''
        continue-on-error: true
        run: |
          SO="mojo/build/${WINNER}.so"
          file "$SO"
          echo "--- exported symbols ---"
          nm -D "$SO" | grep nv_probe || echo "NO C SYMBOL"
          echo "--- runtime dependencies ---"
          ldd "$SO"
          echo "--- ctypes from system python ---"
          python3 -c "
          import ctypes, sys
          lib = ctypes.CDLL(sys.argv[1])
          lib.nv_probe.restype = ctypes.c_int32
          lib.nv_probe.argtypes = [ctypes.c_void_p, ctypes.c_int32]
          print('nv_probe(NULL, 0) ->', lib.nv_probe(None, 0))
          " "$SO"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mojo-kernel
          path: backend/mojo/build/
          if-no-files-found: ignore
