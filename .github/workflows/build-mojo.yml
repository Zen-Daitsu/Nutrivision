name: build-mojo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
          locked: false
          cache: false

      - name: Confirm the checked-out source
        run: |
          echo "commit: $(git rev-parse --short HEAD)"
          cat mojo/probe.mojo

      - name: Build with std.memory import
        id: v1
        continue-on-error: true
        run: |
          mkdir -p mojo/build
          pixi run mojo build --emit shared-lib mojo/probe.mojo -o mojo/build/libnvpost.so

      - name: Retry with bare memory import
        id: v2
        if: steps.v1.outcome == 'failure'
        continue-on-error: true
        run: |
          sed -i 's/^from std\.memory import/from memory import/' mojo/probe.mojo
          pixi run mojo build --emit shared-lib mojo/probe.mojo -o mojo/build/libnvpost.so

      - name: Which import path worked
        run: |
          echo "std.memory: ${{ steps.v1.outcome }}"
          echo "memory:     ${{ steps.v2.outcome }}"
          ls -la mojo/build/ || echo "no artifact"

      - name: Inspect the artifact
        if: hashFiles('backend/mojo/build/libnvpost.so') != ''
        run: |
          file mojo/build/libnvpost.so
          echo "--- exported symbols ---"
          nm -D mojo/build/libnvpost.so | grep -E "nv_decode_nms|nv_abi_version" || echo "NO C SYMBOLS EXPORTED"
          echo "--- runtime dependencies ---"
          ldd mojo/build/libnvpost.so

      - name: Can ctypes load it outside the pixi env
        if: hashFiles('backend/mojo/build/libnvpost.so') != ''
        continue-on-error: true
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('mojo/build/libnvpost.so')
          lib.nv_abi_version.restype = ctypes.c_int32
          print('nv_abi_version() ->', lib.nv_abi_version())
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mojo-kernel
          path: backend/mojo/build/
          if-no-files-found: ignore
