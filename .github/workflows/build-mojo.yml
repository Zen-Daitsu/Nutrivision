name: build-mojo

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: backend/pixi.toml
          locked: false
          cache: false

      - name: Toolchain versions
        run: |
          pixi run mojo --version
          pixi list | grep -Ei "max|mojo" || true

      - name: What does mojo build support
        run: pixi run mojo build --help

      - name: What subcommands exist
        continue-on-error: true
        run: pixi run mojo --help

      - name: Smoke test the source compiles at all
        run: pixi run mojo run mojo/probe.mojo

      - name: Build shared library
        id: build
        continue-on-error: true
        run: |
          mkdir -p mojo/build
          pixi run mojo build --emit shared-lib mojo/probe.mojo -o mojo/build/libnvpost.so

      - name: Inspect the artifact
        if: steps.build.outcome == 'success'
        run: |
          file mojo/build/libnvpost.so
          echo "--- exported symbols ---"
          nm -D mojo/build/libnvpost.so | grep -E "nv_abi_version|nv_decode_nms" || echo "NO C SYMBOLS EXPORTED"
          echo "--- runtime dependencies ---"
          ldd mojo/build/libnvpost.so

      - name: Can ctypes load it outside the pixi env
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -c "
          import ctypes
          lib = ctypes.CDLL('mojo/build/libnvpost.so')
          lib.nv_abi_version.restype = ctypes.c_int32
          print('nv_abi_version() ->', lib.nv_abi_version())
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mojo-probe
          path: backend/mojo/build/
          if-no-files-found: ignore
