version: 1
frontend:
  phases:
    build:
      commands:
        - echo "Static PWA, nothing to compile"
        - printf "window.__NUTRIVISION_API__ = '%s';\n" "$API_BASE_URL" > frontend/js/config.js
        - cat frontend/js/config.js
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []

customHeaders:
  - pattern: '/index.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/sw.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
      - key: 'Service-Worker-Allowed'
        value: '/'
  - pattern: '/js/config.js'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/**'
    headers:
      - key: 'Permissions-Policy'
        value: 'camera=(self), microphone=(), geolocation=()'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
