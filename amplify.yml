# AWS Amplify Hosting build specification — Expo web export
#
# The Expo client targets web through react-native-web. `expo export --platform
# web` produces a static bundle in frontend/dist, which Amplify serves directly.
#
# The API endpoint reaches the bundle through EXPO_PUBLIC_API_URL. Expo inlines
# any EXPO_PUBLIC_* variable at build time, so it must be present in the Amplify
# environment before the export runs -- it cannot be injected afterwards.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - test -n "$EXPO_PUBLIC_API_URL" || (echo "EXPO_PUBLIC_API_URL is unset" && exit 1)
        - echo "building against $EXPO_PUBLIC_API_URL"
        - npx expo export --platform web --output-dir dist
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

customHeaders:
  # Expo emits content-hashed asset filenames, so the bundle is immutable.
  # HTML entry points must never be cached, or an installed client keeps running
  # last week's bundle against this week's API.
  - pattern: '**/*.html'
    headers:
      - key: 'Cache-Control'
        value: 'no-cache, must-revalidate'
  - pattern: '/_expo/static/**'
    headers:
      - key: 'Cache-Control'
        value: 'public, max-age=31536000, immutable'
  - pattern: '/**'
    headers:
      - key: 'Permissions-Policy'
        value: 'camera=(self), microphone=(), geolocation=()'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000; includeSubDomains'
