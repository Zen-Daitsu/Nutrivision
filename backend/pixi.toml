[workspace]
name = "nutrivision-mojo"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64"]
version = "1.0.0"

[tasks]
build-kernel = "mkdir -p mojo/build && mojo build --emit shared-lib mojo/postprocess.mojo -o mojo/build/libnvpost.so"
smoke = "mojo run mojo/postprocess.mojo"

[dependencies]
max = ">=26.4.0,<27"
